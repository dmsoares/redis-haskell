name: codecrafters-redis
version: 0.1.0.0
license: BSD3

ghc-options:
  - -Wall

dependencies:
  - base >= 4.19 && < 5
  - network-simple # establish a simple TCP network
  - bytestring # useful to send bytes over the network
  - network # required when using bytestring
  - text # use Text rather than String
  - stm # may help with a concurrent database
  - containers # may help with the database structure and debugging
  - time # may help with the expiry function
  - async # may help with concurrency
  - mtl # may help with structuring
  - transformers
  # Parsing libs
  - megaparsec
  - parser-combinators
  - parsec
  - attoparsec

executables:
  codecrafters-redis-exe:
    main: Main.hs
    source-dirs: app
    dependencies:
      - codecrafters-redis
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

library:
  source-dirs: lib
  exposed-modules:
    - Redis
  other-modules:
    - Redis.Domain.Command
    - Redis.Domain.Result
    - Redis.Domain.Table
    - Redis.Domain.Resp
    - Redis.Infrastructure.Serialization.Result
    - Redis.Infrastructure.Serialization.Command
    - Redis.Infrastructure.Serialization.Resp
    - Redis.Infrastructure.Table
    - Redis.Application.Workflows.Reply
