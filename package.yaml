# $schema: none

name: codecrafters-redis
version: 0.1.0.0
license: BSD3

ghc-options:
  - -Wall

dependencies:
  - base >= 4.19 && < 5
  - network-simple # establish a simple TCP network
  - bytestring # useful to send bytes over the network
  - network # required when using bytestring
  - text # use Text rather than String
  - stm # may help with a concurrent database
  - stm-containers
  - containers # may help with the database structure and debugging
  - time # may help with the expiry function
  - async # may help with concurrency
  - mtl # may help with structuring
  - transformers
  # Parsing libs
  - megaparsec
  - parser-combinators
  - parsec
  - attoparsec

executables:
  codecrafters-redis-exe:
    main: Main.hs
    source-dirs: app
    dependencies:
      - codecrafters-redis
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

library:
  source-dirs: lib
  exposed-modules:
    - Redis
    - Resp
  other-modules:
    - Redis.Data.Command
    - Redis.Data.Error
    - Redis.Data.Table
    - Redis.Table
    - Redis.Workflows.Ping
    - Redis.Workflows.Ping.Data
    - Redis.Workflows.Echo
    - Redis.Workflows.Echo.Data
    - Redis.Workflows.Set
    - Redis.Workflows.Set.Data
    - Redis.Workflows.Get
    - Redis.Workflows.Get.Data
    - Resp.Data
    - Resp.Serialization
